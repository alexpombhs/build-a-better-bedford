<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 565" role="img" aria-labelledby="title desc">
  <title id="title">BBB Projects — Build a Better Bedford</title>
  <desc id="desc">Arched civil engineering bridge, roadway and BBB monogram on a transparent background</desc>
  <g fill="none" stroke="#10222e" stroke-linejoin="round" stroke-linecap="square">
    <!-- Through arch, upper chord and vertical structural supports -->
    <path d="M89 216 Q320 -8 551 216" stroke-width="20"/>
    <path d="M69 227H571" stroke-width="19"/>
    <path d="M114 198v20 M165 145v73 M215 103v115 M268 77v141 M320 67v151 M372 77v141 M425 103v115 M475 145v73 M526 198v20" stroke-width="11"/>
    <path d="M97 227v52h43l67-52 M543 227v52h-43l-67-52" stroke-width="12"/>
    <!-- Masonry piers with restrained brickwork -->
    <path d="M90 279L56 355h100l-16-76 M550 279l34 76H484l16-76" stroke-width="11"/>
    <path d="M75 308h71M66 331h85M494 308h71M489 331h85M104 280v26M108 331v24M532 280v26M529 331v24" stroke-width="5"/>
    <!-- Perspective roadway below the bridge -->
    <path d="M276 268L146 355 M364 268l130 87" stroke-width="13"/>
    <path d="M320 278v15M320 306v15M320 337v18" stroke-width="8" stroke-dasharray="10 8"/>
  </g>
  <!-- Bold monogram holds the same visual width as bridge above -->
  <g fill="#10222e" font-family="Arial,Helvetica,sans-serif" font-weight="900">
    <text x="320" y="486" font-size="176" letter-spacing="-14" text-anchor="middle">BBB</text>
  </g>
  <path d="M89 519H195M445 519h106" stroke="#10222e" stroke-width="7"/>
  <text x="320" y="531" text-anchor="middle" fill="#10222e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="1.2">BUILD A BETTER BEDFORD</text>
</svg>